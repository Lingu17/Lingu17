<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc"><title id="title">CodeForge AI - perspective code strata and hybrid retrieval paths</title><desc id="desc">Authored static illustration for an engineering portfolio. Project descriptions and links are available as text in the README.</desc><defs><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbcbf4"/><stop offset=".45" stop-color="#a78cc9"/><stop offset="1" stop-color="#655177"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aff1db"/><stop offset="1" stop-color="#367a75"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#d8d4ca"/></linearGradient><radialGradient id="halo"><stop stop-color="#8574ab" stop-opacity=".18"/><stop offset="1" stop-color="#8574ab" stop-opacity="0"/></radialGradient><filter id="soft"><feGaussianBlur stdDeviation="10"/></filter></defs><path d="M0 0H1400V470H0Z" fill="#e6e9e4"/><text x="48" y="56" font-family="monospace" font-size="14" font-weight="400" fill="#4c655d">02 / SOURCE-GROUNDED RETRIEVAL</text><text x="48" y="160" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="600" fill="#182025" letter-spacing="-4">Ask the code.</text><text x="52" y="206" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="400" fill="#4c655d">Follow its sources.</text><text x="52" y="279" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#182025" letter-spacing="2">CODEFORGE AI</text><text x="52" y="319" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58645f">Repository context, dependency paths</text><text x="52" y="350" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58645f">and answers with commit-linked citations.</text><text x="52" y="427" font-family="monospace" font-size="13" font-weight="400" fill="#61706a">HYBRID RETRIEVAL / PGVECTOR / FASTAPI</text><path d="M806 345L1249 345L1163 395L720 395Z" fill="#364b46" opacity=".13"/><path d="M832 280L1262 280L1170 333L740 333Z" fill="#91a99f"/><path d="M813 206L1243 206L1151 260L721 260Z" fill="#b6c8bc"/><path d="M801 118L1249 118L1157 192L709 192Z" fill="#152c28"/><g transform="matrix(1 0 -.75 .60 815 130)"><text x="0" y="0" font-family="monospace" font-size="17" font-weight="400" fill="#c0dccb">query = developer_question</text><text x="0" y="23" font-family="monospace" font-size="17" font-weight="400" fill="#7dd0ac">context = retrieve(query)</text><text x="0" y="46" font-family="monospace" font-size="17" font-weight="400" fill="#d5c7f2">answer = cite(context)</text></g><path d="M745 259C636 277 632 391 763 390M1200 201C1357 231 1339 340 1242 358" fill="none" stroke="#528a76" stroke-width="2"/><text x="658" y="391" font-family="monospace" font-size="12" font-weight="400" fill="#4c655d">LEXICAL</text><text x="1210" y="397" font-family="monospace" font-size="12" font-weight="400" fill="#4c655d">VECTOR</text><text x="1047" y="442" font-family="monospace" font-size="11" font-weight="400" fill="#75867b">CONCEPTUAL RETRIEVAL FLOW</text></svg>