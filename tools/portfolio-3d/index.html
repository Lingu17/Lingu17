<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,sans-serif}.sheet{position:relative;width:1600px;height:900px;overflow:hidden;background:#06121f;color:#f5f8fc}.tag{font:18px Consolas,monospace;letter-spacing:2px;color:#71849a}.rule{width:52px;height:3px;background:#00c7e8}.code canvas{position:absolute;left:430px;top:60px;width:1160px;height:730px}.code .copy{position:absolute;top:78px;left:58px;width:450px}.copy h1{font-size:64px;letter-spacing:-2px;line-height:1.08;margin:32px 0 30px}.copy p{font-size:24px;line-height:1.5;color:#a5b8cb;margin:32px 0}.copy .details{font:19px/2.25 Consolas,monospace;color:#71849a}.foot{position:absolute;bottom:43px;left:58px;right:58px;font:19px Consolas,monospace;color:#71849a;border-top:1px solid #20374b;padding-top:24px}.veri{background:#f5f8fc;color:#071827}.veri canvas{position:absolute;left:0;top:135px;width:1150px;height:700px}.veri .copy{position:absolute;top:72px;right:58px;width:460px}.veri h1{font-size:63px;letter-spacing:-2px;line-height:1.1}.veri .copy p{color:#526b82}.veri .rule{background:#0866f5}.veri .foot{border-color:#d4dfe9}.inter canvas{position:absolute;left:0;top:65px;width:1160px;height:745px}.inter .copy{position:absolute;top:90px;right:58px;width:450px}.inter .copy h1{font-size:59px}.inter .copy p{font-size:23px}.hero{height:970px}.hero .top{position:absolute;left:58px;top:55px;right:58px}.hero h1{font-size:65px;letter-spacing:-2px;margin:26px 0 20px}.hero .top p{font-size:24px;color:#a5b8cb}.hero .models{position:absolute;top:285px;left:38px;right:38px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.hero .model{border-top:1px solid #20374b;padding-top:24px}.hero .model h2{font-size:26px;margin:0 15px 15px}.hero .model canvas{width:490px;height:385px;display:block}.hero .model.light{background:#f5f8fc;color:#071827;border-radius:4px;border-top-color:#d4dfe9}.hero .model p{margin:20px 15px 28px;font-size:19px;line-height:1.5;color:#71849a}.hero .num{color:#00c7e8;font:18px Consolas,monospace;margin-right:17px}.hero .light .num{color:#0866f5}
</style></head><body><div id="sheet" class="sheet"></div><script type="module">
import {draw} from './models.js';
const k=new URLSearchParams(location.search).get('project')||'hero',sheet=document.querySelector('#sheet');
if(k==='codeforge'){
sheet.classList.add('code');sheet.innerHTML='<canvas></canvas><div class="copy"><div class="tag">01 / CODEFORGE AI</div><h1>A repository.<br>Two retrieval paths.<br>One source trail.</h1><div class="rule"></div><p>Real file structure.<br>Ranked code fragments.<br>Commit-linked answers.</p><div class="details">VECTOR + LEXICAL<br>RECIPROCAL-RANK FUSION<br>BOUNDED SOURCE CONTEXT</div></div><div class="foot">CODEFORGE AI <span style="float:right">File heights derive from inspected source lengths.</span></div>';
await draw(sheet.querySelector('canvas'),k);
}else if(k==='vericore'){
sheet.classList.add('veri');sheet.innerHTML='<canvas></canvas><div class="copy"><div class="tag">02 / VERICORE</div><h1>The answer starts<br>inside the document.</h1><div class="rule"></div><p>Passages keep their page and section references. Retrieval decides what reaches the model.</p><div class="details">CHROMADB PASSAGE INDEX<br>COSINE + LEXICAL COVERAGE<br>EVIDENCE OR NOT_FOUND</div></div><div class="foot">VERICORE <span style="float:right">No qualifying evidence → no LLM call.</span></div>';
await draw(sheet.querySelector('canvas'),k);
}else if(k==='intervexa'){
sheet.classList.add('inter');sheet.innerHTML='<canvas></canvas><div class="copy"><div class="tag">03 / INTERVEXA</div><h1>Read the graph.<br>Follow the change.</h1><div class="rule"></div><p>Python declarations and imports meet selected revision comparisons.</p><div class="details">PINNED SOURCE<br>SHARED FILES / IDENTIFIERS<br>SIGNATURE / RESPONSE KEYS</div><p style="font-size:18px;color:#71849a">Findings are advisory.<br>Execution requires configuration.</p></div><div class="foot">INTERVEXA <span style="float:right">Source relationships, not a resolved call graph.</span></div>';
await draw(sheet.querySelector('canvas'),k);
}else{
sheet.classList.add('hero');sheet.innerHTML='<div class="top"><div class="tag">LINGRAJ MALIPATIL / AI & FULL-STACK ENGINEERING</div><h1>Three projects. Three evidence trails.</h1><p>Repository retrieval. Document grounding. Source-aware change analysis.</p></div><div class="models"></div><div class="foot">ORIGINAL CODE-AUTHORED 3D MODELS <span style="float:right">INDEPENDENT PRODUCTS / NO SHARED PIPELINE</span></div>';
const specs=[['codeforge','CodeForge AI','A layered repository, hybrid retrieval and commit-linked source evidence.'],['vericore','Vericore','A cutaway document, page-aware passages and an explicit unknown branch.'],['intervexa','Intervexa','A directed import graph, selected revision paths and advisory references.']];
await Promise.all(specs.map(async([key,title,desc],i)=>{const d=document.createElement('div');d.className='model'+(key==='vericore'?' light':'');d.innerHTML=`<h2><span class="num">0${i+1}</span>${title}</h2><canvas></canvas><p>${desc}</p>`;sheet.querySelector('.models').append(d);await draw(d.querySelector('canvas'),key,{small:true});}));
}
window.ready=true;
</script></body></html>
