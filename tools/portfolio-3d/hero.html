<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#06121f;color:#f5f8fc}.hero{width:1800px;height:1320px;position:relative;overflow:hidden}.top{position:absolute;top:60px;left:70px;right:70px;display:flex;align-items:start;justify-content:space-between}.name{font-size:69px;letter-spacing:-2px;font-weight:600;line-height:1.12}.role{text-align:right;font:21px/1.9 Consolas,monospace;color:#9aaec1;padding-top:3px}.intro{position:absolute;left:70px;top:153px;font-size:27px;color:#9aaec1}.intro b{font-weight:400;color:#00c7e8}.projects{position:absolute;left:47px;right:47px;top:242px;display:grid;grid-template-columns:repeat(3,1fr);column-gap:22px;row-gap:37px}.project{height:459px;position:relative}.project canvas{width:554px;height:342px;display:block}.project:nth-child(2) canvas{transform:translateY(-12px)}.project:nth-child(5) canvas{transform:translateY(8px)}.meta{position:absolute;left:22px;right:10px;top:346px}.type{font:15px/1.6 Consolas,monospace;color:#00c7e8;letter-spacing:1.3px}.meta h2{font-size:29px;letter-spacing:-.4px;font-weight:600;margin:7px 0 6px}.meta p{font-size:20px;line-height:1.6;color:#9aaec1;margin:0}.footer{position:absolute;bottom:44px;left:70px;right:70px;border-top:1px solid #263b4d;padding-top:22px;display:flex;justify-content:space-between;font:17px Consolas,monospace;color:#71849a}
</style></head><body><main class="hero" id="hero"><header class="top"><div class="name">Lingraj Malipatil</div><div class="role">AI & FULL-STACK ENGINEERING<br>PYTHON / TYPESCRIPT / PRODUCT INTERFACES</div></header><div class="intro">From <b>source code</b> and <b>documents</b> to tools people can use.</div><section class="projects"></section><footer class="footer"><span>RETRIEVAL · DEVELOPER SYSTEMS · FULL-STACK APPLICATIONS</span><span>SIX INDEPENDENT PROJECTS</span></footer></main><script type="module">
import {draw} from './hero-models.js';
const projects=[
['codeforge','REPOSITORY INTELLIGENCE','CodeForge AI','Hybrid retrieval. Commit-linked answers.'],
['vericore','DOCUMENT INTELLIGENCE','Vericore','Inspect the evidence. Handle the unknown.'],
['intervexa','DEVELOPER TOOLING','Intervexa','Source relationships. Advisory PR findings.'],
['nexvio','VIDEO ANALYSIS SERVICES','Nexvio','Queued interview and posture analysis.'],
['echovault','FULL-STACK AI CHAT','EchoVault AI','Model API calls. Browser-local history.'],
['resume','RESUME INTELLIGENCE','Smart Resume AI','PDF/DOCX text. Structured suggestions.']];

</script></body></html>
