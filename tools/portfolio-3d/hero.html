<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;background:#111b20;color:#f1ebd6;font-family:Arial,Helvetica,sans-serif}.hero{width:100%;max-width:1200px;aspect-ratio:6/5;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 68%,#304951 0%,#16252c 44%,#111b20 75%)}.copy{position:absolute;z-index:3;left:6%;right:6%;top:7%;text-align:center}.name{font:600 clamp(22px,6vw,72px)/1.05 Georgia,serif;letter-spacing:1px;margin:0 0 2.5%;text-shadow:1px 1px #b1ab99,2px 2px #8d8879,3px 3px #676354,4px 4px #454538,6px 8px 12px #0009}.role{font-size:clamp(12px,3.15vw,38px);line-height:1.4;color:#d49a73;margin:0}.intro{font-size:clamp(11px,2.5vw,30px);line-height:1.5;color:#d6d9ca;margin:2% 0 0}.canvas{position:absolute;left:3%;top:30%;width:94%;height:66%}.grid{position:absolute;inset:0;background-image:linear-gradient(#637c8018 1px,transparent 1px),linear-gradient(90deg,#637c8018 1px,transparent 1px);background-size:7% 8.4%}.footer{position:absolute;bottom:3%;width:100%;text-align:center;font:clamp(9px,1.4vw,17px) Consolas,monospace;letter-spacing:2px;color:#91afb1}
</style></head><body><main class="hero" id="hero"><div class="grid"></div><div class="copy"><h1 class="name">LINGRAJ MALIPATIL</h1><p class="role">AI Engineer · Full-Stack Software Engineer</p><p class="intro">Building AI applications and full-stack tools.</p></div><canvas class="canvas"></canvas><div class="footer">SOURCE · SYSTEMS · INTERFACES</div></main><script type="module">import {draw} from './profession-models.js';await draw(document.querySelector('canvas'));window.ready=true;</script></body></html>
